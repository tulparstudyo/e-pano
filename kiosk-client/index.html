<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dijital Pano - Saf HTML/JS Kiosk (Node.js Yok)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="layouts.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      cursor: none;
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .ticker-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
    }
    .ticker-wrapper {
      display: inline-block;
      white-space: nowrap;
      animation: ticker-anim linear infinite;
    }
    @keyframes ticker-anim {
      0% { transform: translate3d(100vw, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
    @keyframes siren-flash {
      0%, 100% { background-color: #7f1d1d; }
      50% { background-color: #dc2626; }
    }
    .siren-bg {
      animation: siren-flash 1s infinite ease-in-out;
    }
    #notice-content-area p {
      font-size: 24px;
      line-height: 1.4;
    }
  </style>
</head>
<body class="w-screen h-screen">
  <div id="app" class="w-full h-full"></div>

  <script>
    // =========================================================================
    // 1. YAPILANDIRMA VE CİHAZ KİMLİĞİ (Sıfır Node.js Bağımlılığı)
    // =========================================================================
    const RELAY_WS_URL = 'wss://pano.teknovip.net';

    // Cihaz Kimliğini URL parametresinden veya localStorage'dan al
    const urlParams = new URLSearchParams(window.location.search);
    let deviceId = urlParams.get('deviceId') || localStorage.getItem('kiosk_device_id');
    if (!deviceId) {
      deviceId = 'web_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '') : Math.random().toString(36).substring(2, 18));
      localStorage.setItem('kiosk_device_id', deviceId);
    }

    let pairingToken = localStorage.getItem('kiosk_pairing_token') || null;
    let currentPin = null;
    let activeStateHash = null;
    let sliderInterval = null;
    let noticeInterval = null;
    let currentSlideIdx = 0;
    let currentNoticeIdx = 0;
    let ws = null;

    // =========================================================================
    // 2. INDEXEDDB İLE ÇEVRİMDIŞI MEDYA ÖNBELLEĞİ (Offline Media Storage)
    // =========================================================================
    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('KioskMediaDB', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('blobs')) {
            db.createObjectStore('blobs');
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveBlobToDb(id, blob) {
      try {
        const db = await openDb();
        const tx = db.transaction('blobs', 'readwrite');
        tx.objectStore('blobs').put(blob, id);
        return new Promise((res) => { tx.oncomplete = res; });
      } catch (e) {
        console.warn('[IndexedDB] Kayıt hatası:', e);
      }
    }

    async function getBlobFromDb(id) {
      try {
        const db = await openDb();
        const tx = db.transaction('blobs', 'readonly');
        const req = tx.objectStore('blobs').get(id);
        return new Promise((resolve) => {
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) {
        return null;
      }
    }

    // Uzak medyaları indir, IndexedDB'ye at ve yerel ObjectURL'e dönüştür
    async function processAndCacheMedia(payload) {
      if (!payload || !payload.components) return payload;
      const clone = JSON.parse(JSON.stringify(payload));
      const comp = clone.components;

      for (const key of Object.keys(comp)) {
        const item = comp[key];
        if (item && item.type === 'media_slider' && Array.isArray(item.items)) {
          for (const media of item.items) {
            try {
              // Önce IndexedDB'de var mı kontrol et
              let blob = await getBlobFromDb(media.id);
              if (!blob && media.url) {
                // Yoksa internetten indir ve kaydet
                const res = await fetch(media.url);
                if (res.ok) {
                  blob = await res.blob();
                  await saveBlobToDb(media.id, blob);
                }
              }

              // Blob'tan yerel blob: URL'i üret (İnternetsiz de çalışır!)
              if (blob) {
                media.url = URL.createObjectURL(blob);
              }
            } catch (err) {
              console.warn(`[Cache] Medya işlenemedi (${media.id}):`, err);
            }
          }
        }
      }
      return clone;
    }

    // =========================================================================
    // 3. WEBSOCKET BAĞLANTISI (Doğrudan Tarayıcıdan wss://pano.teknovip.net)
    // =========================================================================
    function connectRelay() {
      console.log(`[WS] Bağlanıyor: ${RELAY_WS_URL} (Cihaz: ${deviceId})`);
      ws = new WebSocket(RELAY_WS_URL);

      ws.onopen = () => {
        console.log('[WS] Bağlantı kuruldu.');
        ws.send(JSON.stringify({
          type: 'KIOSK_REGISTER',
          deviceId: deviceId,
          token: pairingToken
        }));
      };

      ws.onmessage = async (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === 'PIN_GENERATED') {
            currentPin = msg.pin;
            pairingToken = null;
            localStorage.removeItem('kiosk_pairing_token');
            renderApp({ layoutId: 'pairing', pin: currentPin, deviceId });
          } else if (msg.type === 'PAIRED_SUCCESS') {
            pairingToken = msg.pairingToken;
            localStorage.setItem('kiosk_pairing_token', pairingToken);
            currentPin = null;
          } else if (msg.type === 'STATUS') {
            if (msg.paired) currentPin = null;
          } else if (msg.type === 'UPDATE_CONTENT') {
            console.log('[WS] Yeni içerik alındı. Medyalar IndexedDB önbelleğine yazılıyor...');
            const cachedPayload = await processAndCacheMedia(msg.payload);
            localStorage.setItem('kiosk_last_payload', JSON.stringify(msg.payload)); // Orijinal şemayı sakla
            renderApp(cachedPayload);
          } else if (msg.type === 'EMERGENCY_ALERT') {
            renderApp({
              layoutId: 'emergency',
              title: msg.title,
              message: msg.message
            });
          } else if (msg.type === 'UNPAIRED') {
            pairingToken = null;
            localStorage.removeItem('kiosk_pairing_token');
            localStorage.removeItem('kiosk_last_payload');
            currentPin = null;
            location.reload();
          }
        } catch (e) {
          console.error('[WS] Mesaj işleme hatası:', e);
        }
      };

      ws.onclose = () => {
        console.warn('[WS] Bağlantı koptu. 5 saniye sonra tekrar denenecek...');
        setTimeout(connectRelay, 5000);
      };

      ws.onerror = (e) => {
        console.error('[WS] Soket hatası:', e);
        ws.close();
      };
    }

    // 60 saniyede bir Cloudflare 100sn timeout önleyici Ping/Telemetri
    setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'KIOSK_TELEMETRY',
          cpuUsage: 10,
          memFreeMb: 2048,
          diskFreeGb: 50,
          resolution: `${window.innerWidth}x${window.innerHeight}`,
          uptimeSec: Math.round(performance.now() / 1000)
        }));
      }
    }, 45 * 1000);

    // =========================================================================
    // 4. EKRAN RENDER MOTORU (Çoklu Şablon & Offline Oynatıcı)
    // =========================================================================
    function renderApp(data) {
      const root = document.getElementById('app');
      clearInterval(sliderInterval);
      clearInterval(noticeInterval);

      // DURUM 0: ACİL DURUM (SİREN TAHLİYE MODU)
      if (data.layoutId === 'emergency') {
        root.innerHTML = `
          <div class="siren-bg w-full h-full flex flex-col items-center justify-center text-white p-12 text-center select-none">
            <div class="text-9xl mb-6 animate-bounce">🚨</div>
            <h1 class="text-7xl font-black tracking-widest uppercase mb-6 drop-shadow-2xl">
              ${data.title || 'ACİL TAHLİYE UYARISI'}
            </h1>
            <p class="text-4xl font-extrabold max-w-4xl leading-relaxed bg-black/40 p-8 rounded-3xl border-4 border-white/40 shadow-2xl">
              ${data.message || 'Lütfen acil çıkış kapılarını kullanarak binayı derhal boşaltınız!'}
            </p>
            <div class="mt-8 text-2xl font-bold tracking-widest uppercase bg-white text-red-900 px-8 py-3 rounded-full shadow-xl">
              PANİK YAPMAYINIZ • ASANSÖRLERİ KULLANMAYINIZ
            </div>
          </div>
        `;
        return;
      }

      // DURUM A: EŞLEŞMEMİŞ CİHAZ (PIN & QR EKRANI)
      if (data.layoutId === 'pairing') {
        root.innerHTML = `
          <div class="flex flex-col items-center justify-center h-full space-y-8 bg-slate-950 text-white p-8">
            <div class="text-center">
              <div class="inline-block p-2 bg-blue-500/10 rounded-full border border-blue-500/20 mb-4">
                <span class="text-blue-400 font-bold px-4 py-1 text-sm tracking-wider uppercase">Saf Web Kiosk Modu (Node.js Yok)</span>
              </div>
              <h1 class="text-5xl font-black tracking-tight mb-3">DİJİTAL DUYURU PANOSU</h1>
              <p class="text-slate-400 text-xl max-w-2xl">
                Bu ekranı Yönetici Stüdyosu'ndan eklemek için aşağıdaki 6 haneli PIN kodunu girin.
              </p>
            </div>
            
            <div class="flex items-center gap-12 bg-slate-900/90 p-10 rounded-3xl shadow-2xl border border-slate-800">
              <div id="qrcode-box" class="p-4 bg-white rounded-2xl shadow-inner"></div>
              <div class="flex flex-col items-center">
                <span class="text-sm font-bold tracking-widest text-slate-400 uppercase mb-2">EŞLEŞTİRME PIN KODU</span>
                <span class="text-8xl font-mono font-black text-amber-400 tracking-widest leading-none drop-shadow-md">
                  ${data.pin || '------'}
                </span>
                <span class="text-xs font-mono text-slate-500 mt-6 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
                  Cihaz ID: ${data.deviceId}
                </span>
              </div>
            </div>

            <div class="text-slate-500 text-sm flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
              pano.teknovip.net bağlantısı aktif. Yönetici onayı bekleniyor...
            </div>
          </div>
        `;

        if (data.pin && typeof QRCode !== 'undefined') {
          const qrContainer = document.getElementById('qrcode-box');
          if (qrContainer) {
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
              text: `DUYURU_PAIR:${data.deviceId}:${data.pin}`,
              width: 180,
              height: 180,
              colorDark: '#0f172a',
              colorLight: '#ffffff',
              correctLevel: QRCode.CorrectLevel.M
            });
          }
        }
        return;
      }

      // DURUM B: CANLI GÖSTERİM (SEÇİLİ ŞABLON)
      const comp = data.components || {};
      const layoutClass = data.layoutId || 'layout-classic-school';
      const headerTitle = comp.title?.value || 'DİJİTAL DUYURU PANOSU';
      const marqueeText = comp.ticker?.messages && comp.ticker.messages.length > 0
        ? comp.ticker.messages.join('    •    ')
        : '';
      const tickerSpeed = (data.theme?.tickerSpeed || 25);

      root.innerHTML = `
        <div class="${layoutClass}">
          <!-- Üst Bant (Header) -->
          <header class="bg-blue-950/80 px-8 flex items-center justify-between border-b border-blue-900/60 shadow-lg">
            <div class="flex items-center gap-3">
              <span class="w-3.5 h-3.5 rounded-full bg-emerald-400 shadow-[0_0_12px_#34d399]"></span>
              <h1 class="text-2xl font-extrabold tracking-wide uppercase text-white drop-shadow">${headerTitle}</h1>
            </div>
            <div id="live-clock" class="text-2xl font-mono font-bold text-blue-200"></div>
          </header>

          <!-- Ana Gövde -->
          <main class="main-viewport">
            <!-- Sol Sütun: Üst Medya Slider (2/3) + Alt Sabit Duyuru Alanı (1/3) -->
            <div class="flex flex-col gap-4 overflow-hidden h-full">
              <!-- 1. Üst Medya Slider (2/3 Yükseklik) -->
              <div class="h-[65%] bg-slate-900/90 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl relative flex items-center justify-center">
                <div id="media-viewport" class="w-full h-full flex items-center justify-center overflow-hidden">
                  <span class="text-slate-600 text-lg">Yüklü Medya Bulunmuyor</span>
                </div>
              </div>

              <!-- 2. Alt Sabit Duyuru Alanı (1/3 Yükseklik - Efektli Geçişli) -->
              <div class="h-[35%] bg-slate-900/90 rounded-2xl p-6 border border-slate-800 shadow-2xl flex flex-col justify-center relative overflow-hidden">
                <span id="notice-counter" class="absolute top-4 right-4 text-xs bg-slate-800/80 text-amber-300 px-2.5 py-0.5 rounded-full font-mono border border-slate-700">1/1</span>
                <div id="notice-content-area" class="w-full flex flex-col justify-center overflow-hidden transition-all duration-500 ease-in-out transform"></div>
              </div>
            </div>

            <div class="bg-slate-900/90 rounded-2xl p-6 border border-slate-800 shadow-2xl flex flex-col table-card">
              <h2 class="text-2xl font-black text-amber-400 mb-4 pb-3 border-b border-slate-800 flex items-center justify-between">
                <span>${comp.infoTable?.label || 'Güncel Bilgiler'}</span>
                <span class="text-xs bg-amber-400/10 text-amber-300 font-mono px-3 py-1 rounded-full border border-amber-400/20">BİLGİ</span>
              </h2>
              <div class="flex-1 overflow-hidden">
                <table class="w-full text-left">
                  <thead>
                    <tr class="text-slate-400 text-sm uppercase tracking-wider border-b border-slate-800">
                      ${(comp.infoTable?.columns || []).map(c => `<th class="py-2.5 font-bold">${c}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody class="text-lg">
                    ${(comp.infoTable?.rows || []).map(row => `
                      <tr class="border-b border-slate-800/60 hover:bg-slate-800/30 transition">
                        ${(comp.infoTable.columns || []).map(col => `<td class="py-3.5 font-semibold text-slate-100">${row[col] || '-'}</td>`).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          <!-- Alt Bant: Kayan Yazı -->
          <footer class="bg-slate-950 border-t border-slate-800/80 px-4 flex items-center overflow-hidden">
            <div class="ticker-container">
              <div class="ticker-wrapper font-bold text-xl text-amber-300 tracking-wide" style="animation-duration: ${tickerSpeed}s">
                ${marqueeText}
              </div>
            </div>
          </footer>
        </div>
      `;

      updateClock();
      startMediaSlider(comp.slider);
      startNoticeSlider(comp.noticeBox);
    }

    function startNoticeSlider(noticeBox) {
      const container = document.getElementById('notice-content-area');
      const counter = document.getElementById('notice-counter');
      if (!container) return;

      const items = noticeBox?.items && noticeBox.items.length > 0
        ? noticeBox.items
        : [
            {
              title: 'Günün Duyurusu',
              content: 'Önemli duyuru ve bilgilendirmeler bu alanda otomatik ve efektli geçişle yayınlanır.'
            }
          ];

      currentNoticeIdx = 0;

      function displayNotice() {
        const item = items[currentNoticeIdx];
        if (!item) return;

        // Efektli Çıkış: Hafif yukarı kayıp şeffaflaşma
        container.style.opacity = '0';
        container.style.transform = 'translateY(-6px)';

        setTimeout(() => {
          container.innerHTML = `
            ${item.title ? `<h4 class="text-xl font-black text-amber-300 mb-1.5 truncate drop-shadow">${item.title}</h4>` : ''}
            <p class="text-[24px] text-slate-100 font-medium leading-relaxed" style="font-size: 24px; line-height: 1.4;">${item.content || ''}</p>
          `;
          if (counter) {
            counter.innerText = `${currentNoticeIdx + 1}/${items.length}`;
          }

          // Efektli Giriş: Yumuşakça yerine oturma
          container.style.opacity = '1';
          container.style.transform = 'translateY(0)';
        }, 220);

        currentNoticeIdx = (currentNoticeIdx + 1) % items.length;
      }

      displayNotice();
      if (items.length > 1) {
        noticeInterval = setInterval(displayNotice, (noticeBox.durationSec || 5) * 1000);
      }
    }

    function startMediaSlider(slider) {
      if (!slider || !slider.items || slider.items.length === 0) return;
      const viewport = document.getElementById('media-viewport');
      if (!viewport) return;

      currentSlideIdx = 0;

      function renderCurrentSlide() {
        const item = slider.items[currentSlideIdx];
        if (!item) return;

        // Mevcut eleman için Çıkış Efekti (Fade Out + Hafif Büyüme)
        const currentEl = viewport.firstElementChild;
        if (currentEl) {
          currentEl.style.transition = 'opacity 0.7s ease-in-out, transform 0.7s ease-in-out';
          currentEl.style.opacity = '0';
          currentEl.style.transform = 'scale(1.03)';
        }

        setTimeout(() => {
          let newEl;
          if (item.mediaType === 'video') {
            newEl = document.createElement('video');
            newEl.src = item.url;
            newEl.autoplay = true;
            newEl.muted = true;
            newEl.loop = true;
          } else {
            newEl = document.createElement('img');
            newEl.src = item.url;
            newEl.alt = 'Slayt';
          }
          newEl.className = 'w-full h-full object-cover';
          newEl.style.opacity = '0';
          newEl.style.transform = 'scale(0.97)';
          newEl.style.transition = 'opacity 0.7s ease-in-out, transform 0.7s ease-in-out';
          newEl.onerror = () => newEl.remove();

          viewport.innerHTML = '';
          viewport.appendChild(newEl);

          requestAnimationFrame(() => {
            newEl.style.opacity = '1';
            newEl.style.transform = 'scale(1)';
          });
        }, currentEl ? 350 : 0);

        currentSlideIdx = (currentSlideIdx + 1) % slider.items.length;
      }

      renderCurrentSlide();
      if (slider.items.length > 1) {
        sliderInterval = setInterval(renderCurrentSlide, (slider.durationSec || 8) * 1000);
      }
    }

    function updateClock() {
      const clockEl = document.getElementById('live-clock');
      if (!clockEl) return;
      const now = new Date();
      clockEl.innerText = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);

    // =========================================================================
    // 5. BAŞLANGIÇ: ÖNCE ÇEVRİMDIŞI ÖNBELLEĞİ KONTROL ET, SONRA SUNUCUYA BAĞLAN
    // =========================================================================
    async function initKiosk() {
      const savedRaw = localStorage.getItem('kiosk_last_payload');
      if (savedRaw && pairingToken) {
        try {
          const cachedPayload = await processAndCacheMedia(JSON.parse(savedRaw));
          renderApp(cachedPayload);
        } catch (e) {}
      } else {
        renderApp({ layoutId: 'pairing', pin: null, deviceId });
      }

      // WebSocket hattını aç
      connectRelay();
    }

    initKiosk();
  </script>
</body>
</html>
