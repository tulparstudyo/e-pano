# ==============================================================================
# NGINX KONFİGÜRASYONU - depo.teknovip.net
# Konum: /etc/nginx/sites-available/depo.teknovip.net
# ==============================================================================

# 1. HTTP -> HTTPS Yönlendirmesi
server {
    listen 80;
    listen [::]:80;
    server_name depo.teknovip.net;

    # Let's Encrypt ACME challenge doğrulaması
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS & WebSocket Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name depo.teknovip.net;

    # Let's Encrypt SSL Sertifikaları
    ssl_certificate /etc/letsencrypt/live/depo.teknovip.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/depo.teknovip.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cloudflare Free plan uyumlu maksimum dosya boyutu (100MB)
    client_max_body_size 100M;

    # REST API Uç Noktaları
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Statik Medya Yüklemeleri
    location /media/ {
        proxy_pass http://127.0.0.1:8080/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # WebSocket Hub (ws/wss ve root istekleri)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket bağlantısının kopmaması için timeout süreleri
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
